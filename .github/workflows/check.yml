name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Windows, where yap is used and where its path and line-ending rules bite.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
